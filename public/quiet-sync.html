<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5a45">
<title>Pebble · Quiet Sync</title>
<style>
  :root { color-scheme: light dark; --paper: #f2f7f4; --card: #fff; --ink: #20332b; --soft: #557066; --line: #cce0d6; --accent: #20674e; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #131f1b; --card: #1b2b25; --ink: #ecf7f1; --soft: #abc6b9; --line: #38564a; --accent: #91dabb; }
  }
  * { box-sizing: border-box; }
  body {
    display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; margin: 0; padding: 1.25rem;
    background: var(--paper); color: var(--ink); font: 1rem/1.5 system-ui, sans-serif;
  }
  main { width: min(100%, 29rem); border: 1px solid var(--line); border-radius: 1.4rem; padding: clamp(1.25rem, 5vw, 2rem); background: var(--card); }
  h1 { margin: 0; font-size: 1.45rem; }
  p { margin: .5rem 0 1.35rem; color: var(--soft); }
  .actions { display: grid; gap: .5rem; }
  a, button {
    min-height: 44px; display: grid; place-items: center; padding: .5rem 1rem; border: 1px solid var(--line);
    border-radius: .8rem; color: var(--accent); background: transparent; text-decoration: none; font: inherit; font-weight: 600; cursor: pointer;
  }
  button { border-color: var(--accent); }
  button[disabled] { cursor: default; opacity: .6; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { margin: .75rem 0 0; }
  #status:empty { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Quiet Sync is paused</h1>
  <p id="description">This page hasn’t been saved on this device. Open a saved page or sync to download it. Some sections require turning off Quiet Sync in Settings.</p>
  <div class="actions">
    <a id="dashboard" href="/dashboard">Open saved Dashboard</a>
    <button id="sync" type="button">Sync now</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  (function () {
    var cookie = (document.cookie.match(/(?:^|; )pebble-lang=([^;]+)/) || [])[1];
    var zh = cookie === 'zh' || (!cookie && /^zh/i.test(navigator.language || ''));
    var sync = document.getElementById('sync');
    var status = document.getElementById('status');
    if (zh) {
      document.documentElement.lang = 'zh-CN';
      document.title = 'Pebble · 按需同步';
      document.getElementById('title').textContent = '按需同步已暂停';
      document.getElementById('description').textContent = '此页面尚未保存在本机。请打开已保存的页面，或立即同步下载。部分页面需要在设置中关闭轻量同步。';
      document.getElementById('dashboard').textContent = '打开已保存的概览';
      sync.textContent = '立即同步';
    }
    function request() {
      var worker = navigator.serviceWorker && navigator.serviceWorker.controller;
      function fail() {
        status.textContent = zh ? '无法同步此页面。' : 'This page could not sync.';
        sync.disabled = false;
      }
      if (!worker) { fail(); return; }
      sync.disabled = true;
      status.textContent = zh ? '正在同步…' : 'Syncing…';
      var channel = new MessageChannel();
      var timeout = setTimeout(function () { channel.port1.close(); fail(); }, 120000);
      channel.port1.onmessage = function (event) {
        clearTimeout(timeout);
        channel.port1.close();
        if (event.data && event.data.authExpired) location.replace('/auth/sign-in');
        else if (event.data && event.data.ok) location.replace(location.href);
        else fail();
      };
      worker.postMessage({ type: 'QUIET_SYNC_FALLBACK' }, [channel.port2]);
    }
    sync.addEventListener('click', request);
  })();
</script>
</body>
</html>
